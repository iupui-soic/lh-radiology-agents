# Dev stack for the LH-Radiology system.
#
# EHR/RIS is the OpenMRS 3 (o3) reference-application BACKEND with legacyui + the
# LibreHealth Radiology module baked in (built from the sibling lh-radiology repo,
# o3 branch, docker/o3/Dockerfile). The o3 backend image is arm64-native, so it runs
# natively on Apple Silicon (the old amd64 RefApp distro did not). Radiology UI is the
# legacy JSP UI served by legacyui at /openmrs/... — there is no SPA/gateway in scope.
#
# Bring up the RIS stack:   docker compose up -d mariadb openmrs orthanc ohif
#   OpenMRS (legacyui):     http://localhost:8080/openmrs/   (admin / Admin123)
#   Orthanc:                http://localhost:8042/
#   OHIF viewer:            http://localhost:3000/
# Temporal services below are for the agent orchestrator (independent of the RIS stack).
#
# Distributed tracing (#28) is OPT-IN and off by default — with OTEL_EXPORTER_OTLP_ENDPOINT
# unset, every service's tracing gate is False and no OTel code runs at all. To turn it on:
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 docker compose --profile otel up -d
#   Jaeger UI:              http://localhost:16686/   (one trace per study, across all agents)

# Injected into the study-trace app services (worklist-api, off the trace path, does not
# carry it). Empty by default => tracing fully off (see tracing_enabled()).
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  # --- EHR / RIS: OpenMRS 3 backend + legacyui + lh-radiology --------------------
  openmrs:
    # o3 reference-application backend with the LibreHealth Radiology module baked in.
    # HOW OTHER DEVS GET THIS IMAGE: the lh-radiology CI builds docker/o3/Dockerfile and pushes
    # it to the project's PUBLIC GitLab Container Registry on every o3-branch pipeline, so you
    # do NOT need the lh-radiology source to run the stack — `docker compose up` pulls it.
    #   Published image (per branch):
    #     registry.gitlab.com/librehealth/radiology/lh-radiology/o3:o3   (docker pull, no auth)
    #   Build from source instead (module developers): clone lh-radiology on the o3 branch as a
    #   sibling of this repo, then `docker compose build openmrs` (uses the build: block below).
    # Digest-pinned (#72) as of 2026-08-05. The earlier pin attempt died because o3:o3 is a
    # moving tag rebuilt per lh-radiology pipeline, and GitLab's registry garbage-collects
    # manifests that lose their last tag: the pinned digest 404d (MANIFEST_UNKNOWN) after the
    # next upstream push. A digest stays pullable only while SOME tag references it, so the
    # precondition stated here previously (an immutable tag upstream) now exists: o3-20260714
    # references this exact manifest and nothing ever re-pushes it. The digest is the
    # 2026-07-14 multiarch build, validated 2026-08-05 by a clean-volume arm64 boot (9m2s to
    # an authenticated session). To bump: tag the new list digest immutably in the
    # lh-radiology registry FIRST, then update this line; never pin a digest that only the
    # moving o3:o3 tag references.
    # The pin rides the TAG, not a @sha256 suffix, because this service also has a build:
    # block and compose tags source builds with this exact name; a name carrying a digest
    # breaks `docker compose build openmrs` and `up --build` with "build tag cannot contain
    # a digest". The tag is never re-pushed, so it is equivalent in practice; the manifest it
    # references is sha256:9116f73133e1f31784009a675f3e32102f4263b4c8693ebb856f049d56823794
    # (verify with: docker buildx imagetools inspect <image>).
    image: registry.gitlab.com/librehealth/radiology/lh-radiology/o3:o3-20260714
    pull_policy: missing                  # `up` pulls the published image; build only on `compose build`
    build:
      context: ../lh-radiology            # sibling checkout of lh-radiology (o3 branch)
      dockerfile: docker/o3/Dockerfile
    ports: ["8080:8080"]
    environment:
      # o3 backend startup.sh reads OMRS_* (see startup-init.sh). Use the mariadb
      # JDBC driver (bundled in the war) against the mariadb service below.
      OMRS_DB: mariadb
      OMRS_DB_HOSTNAME: mariadb
      OMRS_DB_PORT: "3306"
      OMRS_DB_NAME: openmrs
      OMRS_DB_USERNAME: openmrs         # NOTE: OMRS_DB_USERNAME (not OMRS_DB_USER)
      OMRS_DB_PASSWORD: openmrs
      OMRS_CREATE_TABLES: "true"        # first boot: build the schema
      OMRS_AUTO_UPDATE_DATABASE: "true" # run Liquibase migrations on boot
      OMRS_ADMIN_USER_PASSWORD: Admin123
      OMRS_MODULE_WEB_ADMIN: "true"
      # OMRS_SEARCH defaults to 'lucene' -> no Elasticsearch dependency.
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      # Ready != booting. OpenMRS 302-redirects every request to /initialsetup for the WHOLE boot,
      # and `curl -f` treats that 302 as success -- so the old check went healthy while the server
      # was still unusable. Gate on an actual 200 so `depends_on: service_healthy` waits for a
      # usable server (#65). See docs/o3-dev-stack.md.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/openmrs/ws/rest/v1/session | grep -qx 200"]
      interval: 15s
      timeout: 10s
      retries: 120           # first boot is ~10min (native arm64) to ~20min (emulated amd64)
      start_period: 180s     # Liquibase + concept-dictionary import + module startup

  mariadb:
    image: mariadb:10.11@sha256:5a5c675881ef3fd1c1da9b0a3bfd6ee82edbe39cd9e32e06be18034c37235e0e   # pinned (#72)
    environment:
      MARIADB_ROOT_PASSWORD: openmrs
      MARIADB_DATABASE: openmrs
      MARIADB_USER: openmrs
      MARIADB_PASSWORD: openmrs
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes: ["mariadb-data:/var/lib/mysql"]

  # --- One-shot: provision the AI pre-sign impression draft concept in o3 --------
  # Ensures the "AI pre-sign impression draft" concept exists at its stable UUID
  # in the OpenMRS concept dictionary before any workflow tries to write a pre-sign
  # DiagnosticReport via fhir2 (#55). Idempotent -- runs on every `compose up`, but
  # only inserts if the concept isn't already there.
  #
  # Runs against mariadb via direct SQL rather than the OpenMRS REST endpoint
  # because REST auto-assigns UUIDs on POST and won't honour the caller-supplied
  # UUID we need to be stable across deployments. See docker/openmrs/README.md
  # and docs/presign-concept.md for the full rationale.
  presign-concept-bootstrap:
    image: python:3.11-slim@sha256:baf89808ec37adeaab83cec287adb4a2afa4a11c1d51e961c7ec737877e61af6   # pinned (#72)
    depends_on:
      openmrs:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    environment:
      OMRS_DB_HOSTNAME: mariadb
      OMRS_DB_NAME: openmrs
      OMRS_DB_USERNAME: openmrs
      OMRS_DB_PASSWORD: openmrs
    volumes:
      - ./docker/openmrs/bootstrap_presign_concept.py:/opt/bootstrap.py:ro
    command:
      - sh
      - -c
      - "pip install --quiet --no-cache-dir pymysql==1.1.0 && python /opt/bootstrap.py"
    restart: "no"

  # --- PACS ---------------------------------------------------------------------
  # SQLite-backed Orthanc with DICOMweb enabled for OHIF, and the OnStableStudy
  # Python plugin wired at /etc/orthanc/orthanc_stable_study.py. The orthancteam
  # image ships the Python plugin (v7.1) built-in and auto-enables it as soon as
  # a PythonScript setting is present in the config (docker/orthanc/orthanc.json).
  orthanc:
    image: orthancteam/orthanc:latest@sha256:fdb2bd7c80fab08578b5d3080f125eb9336994781a6e5f512fb962dca1414c30   # pinned to digest (#72)
    ports: ["8042:8042", "4242:4242"]
    environment:
      # Where the plugin POSTs the OrthancStableStudyEvent. Must be http(s);
      # the plugin refuses non-http(s) URLs at runtime (Bandit B310 / CWE-939).
      ORCH_WEBHOOK_URL: http://orchestrator:8090/webhooks/orthanc
    volumes:
      - orthanc-db:/var/lib/orthanc/db
      # Mount target MUST be orthanc.json exactly (#94): the orthancteam image reads only that
      # filename at boot and does NOT merge arbitrary /etc/orthanc/*.json. Under the old
      # lh-radiology.json name the PythonScript setting was invisible, so the plugin loaded with
      # no script and OnStableStudy never fired the webhook.
      - ./docker/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      # The plugin file is mounted read-only; edits happen via git + `docker compose restart orthanc`.
      - ./integrations/orthanc-plugin/orthanc_stable_study.py:/etc/orthanc/orthanc_stable_study.py:ro
    restart: unless-stopped
    # NOTE on ordering: orthanc does NOT depends_on orchestrator (would cycle with the
    # orchestrator -> orthanc dependency below). The plugin's `_post` swallows exceptions
    # and orthanc.LogError()s, so early webhooks that arrive before the orchestrator is
    # up are logged and dropped. StableAge (60s default) makes an early race unlikely.

  # --- Viewer -------------------------------------------------------------------
  # OHIF viewer with our worklist extension baked in (issue #21).
  # Built from integrations/ohif-extension/Dockerfile: multi-stage build that
  # fetches OHIF Viewers at the exact commit pinned by OHIF_REF (there is no
  # v3.6.5 git tag upstream, so we pin a release/3.6 commit), drops our
  # extension package under extensions/, registers it in pluginConfig.json,
  # runs the OHIF webpack build, then serves the dist/ from nginx. NOT a
  # fork -- we consume OHIF at a pinned commit and add our plugin alongside;
  # version bumps are a single-line change to the Dockerfile's OHIF_REF arg.
  #
  # nginx also proxies /reading-api/* -> worklist-api and /orchestrator-api/*
  # -> ingress so the browser stays same-origin (no CORS on either service).
  ohif:
    image: registry.gitlab.com/librehealth/radiology/lh-radiology-agents/ohif:${APP_IMAGE_TAG:-main}
    build:
      context: .
      dockerfile: integrations/ohif-extension/Dockerfile
    ports: ["3000:80"]
    volumes:
      - ./docker/ohif/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ohif/app-config.js:/usr/share/nginx/html/app-config.js:ro
    depends_on: [orthanc, worklist-api]
    restart: unless-stopped

  # --- Temporal (durable orchestration engine, for the agent system) ------------
  temporal:
    image: temporalio/auto-setup:1.24.2@sha256:10e8c557ace5fa4aa99217637e7b9969316e89b929a3bfb117853a5417eef25c   # pinned to digest (#72)
    ports: ["7233:7233"]
    environment:
      DB: postgres12
      DB_PORT: 5432                  # REQUIRED: auto-setup defaults DB_PORT to 3306 (MySQL); Postgres is 5432
      POSTGRES_SEEDS: temporal-postgresql
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
    depends_on: [temporal-postgresql]

  temporal-postgresql:
    image: postgres:16@sha256:fe03a7605299a34ddf5e4f285dff78c3d7190a576b3c6b46f2fcff69f4bffd54   # pinned (#72)
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes: ["temporal-pg-data:/var/lib/postgresql/data"]

  temporal-ui:
    image: temporalio/ui:2.30.1@sha256:1833a44628b7866a139f81bd1bdd1e568f22de0999bbf5b7f52645faa82043c7   # pinned to digest (#72)
    ports: ["8088:8080"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on: [temporal]

  # --- Comms ledger (#52): the Communications Agent's write store -----------------
  # A SEPARATE FHIR server, on purpose. The Communications Agent must durably record "we told
  # someone" (Communication) and "did they acknowledge?" (Task, with the ack deadline on
  # restriction.period), and look up who is on call (PractitionerRole). OpenMRS fhir2 implements
  # NONE of those, and the locked decision keeps it a read-only source of clinical context — so
  # these writes land here instead. fhir2 is still the only source of clinical truth: a report's
  # content is always read from fhir2, never copied into this ledger. See
  # libs/radagent-common/radagent_common/comms_ledger.py.
  #
  # DURABLE audit trail (#72): the comms ledger is the clinical-communication record, so it must
  # survive `docker compose down && up`. HAPI defaults to in-memory H2 (wiped on down); here it is
  # backed by a FILE-based H2 under a named volume (spring.datasource.* + volumes below). A real
  # deployment points HAPI at a managed database instead.
  comms-ledger:
    image: hapiproject/hapi:v7.4.0@sha256:f34b41f5002665f384cf344da2d8e653025bd095aa37aa6f5a9d6dc0dac75684   # pinned (#72)
    ports: ["8108:8080"]
    environment:
      # R4 to match every other FHIR surface in the stack (fhir2 is R4).
      hapi.fhir.fhir_version: R4
      # The agent creates Communication/Task with server-assigned ids, and seeds the on-call
      # directory by PUTting Practitioner/PractitionerRole at known ids.
      hapi.fhir.allow_external_references: "true"
      # The ledger deliberately holds RELATIVE references to resources that live in fhir2, not here:
      # Communication.subject and Task.for point at Patient/*, and basedOn/about point at
      # ServiceRequest/*. Those must NOT exist in the ledger (fhir2 is the only source of clinical
      # truth, never copied in). Two things break without this:
      #   1. HAPI enforces referential integrity on write by default and rejects such a reference
      #      with HTTP 400 (HAPI-1094 "Resource Patient/... not found"), so every ledger write fails.
      #   2. Even with integrity off, HAPI does not INDEX a reference whose target is absent, so
      #      search_communications by based-on/subject silently returns nothing (a lost audit trail).
      # Auto-creating an empty placeholder target (no clinical content, just a typed id) fixes both:
      # the write passes integrity and the reference indexes, so the audit-by-order search works.
      # Verified end-to-end against this HAPI image (create + for-alias + read-modify-write +
      # search-by-based-on + audit join, all green).
      hapi.fhir.auto_create_placeholder_reference_targets: "true"
      # DURABLE storage (#72): override HAPI's default in-memory H2 with a FILE-based H2 under the
      # comms-ledger-data volume, so Communication/Task audit records survive `down && up`.
      # DB_CLOSE_DELAY=-1 keeps the DB open between pooled connections; DB_CLOSE_ON_EXIT=FALSE keeps
      # the file intact on JVM shutdown. The comms-ledger.mv.db file under /data/hapi is what
      # persists. Live-verified on the demo stack; needs comms-ledger-init below (the image runs as
      # uid 65532 and cannot write a root-owned fresh volume -- found as a live crash-loop:
      # AccessDeniedException on /data/hapi/comms-ledger.trace.db, 23 restarts).
      spring.datasource.url: "jdbc:h2:file:/data/hapi/comms-ledger;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
      spring.datasource.username: sa
      spring.datasource.password: ""
      spring.datasource.driverClassName: org.h2.Driver
      spring.jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirH2Dialect
    # NO healthcheck -- deliberately. hapiproject/hapi is distroless (the entrypoint is `java`
    # itself; no curl, no shell), so ANY exec-form probe fails with "executable file not found"
    # and the container sits permanently `unhealthy` while serving fine (the previous curl check
    # did exactly that, and once #69 gated dependents on service_healthy, nothing downstream
    # could ever start). Readiness lives where a probe can actually run: the on-call seed polls
    # /fhir/metadata before writing, and the agent's ledger client is lazy behind Temporal's
    # unbounded COMMUNICATE retry.
    restart: unless-stopped
    volumes:
      - comms-ledger-data:/data/hapi
    depends_on:
      comms-ledger-init:
        condition: service_completed_successfully

  # One-shot volume-permission init for the ledger (#72). The hapi image is distroless and runs as
  # uid 65532 (nonroot), but a freshly created named volume is root-owned -- so the file-H2 above
  # crash-loops on AccessDeniedException before its first write (observed live: 23 restarts).
  # Same one-shot idiom as presign-concept-bootstrap: runs to completion each `up`, idempotent.
  # Hardened to its minimum authority: it must run as root to chown, so everything else is taken
  # away -- no network, no capability beyond CAP_CHOWN, a read-only root fs (the volume is its only
  # writable surface), and no privilege escalation. Its whole life is one chown, then exit.
  comms-ledger-init:
    image: alpine:latest@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b   # pinned (#72); digest wins, tag is a label
    command: ["chown", "-R", "65532:65532", "/data/hapi"]
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt:
      - no-new-privileges:true
    volumes:
      - comms-ledger-data:/data/hapi

  # --- Tracing backend (#28), opt-in: `docker compose --profile otel up` -----------
  # Jaeger all-in-one = OTLP receiver + storage + UI in one container. It only starts under the
  # `otel` profile, so the default stack is byte-for-byte unchanged. 4318 = OTLP/HTTP, which is
  # what init_tracing()'s exporter speaks (opentelemetry.exporter.otlp.proto.http).
  jaeger:
    # Explicit version (acceptable per #72): opt-in via the `otel` profile, so it is not in the
    # default demo path. Digest-pin this too if the showcase ever runs with tracing on.
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["otel"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP/HTTP receiver

  # --- Application services (M1) -------------------------------------------------
  orchestrator:
    # Every app service names its CI-published image (#97) alongside its build: block (#98).
    # Dev flow is UNCHANGED: with build: present compose defaults to pull_policy build, so
    # `up`/`compose build` still build from the checkout. The demo host deploys by pulling
    # instead: `docker compose pull <app services> && up -d --no-deps <app services>` (see the
    # run-book's deploy-window section). APP_IMAGE_TAG steers the tag: `main`, a short SHA, or
    # a vX.Y.Z release tag, so the running demo is attributable to an exact published image.
    # Pulls are anonymous (public project registry); no token or login on the host.
    image: registry.gitlab.com/librehealth/radiology/lh-radiology-agents/orchestrator:${APP_IMAGE_TAG:-main}
    build: { context: ., dockerfile: orchestrator/Dockerfile }
    # `wait -n` exits when either the worker or the ingress dies, so `restart` recovers the
    # container. worker.py retries the Temporal connect while temporal is still booting.
    command: ["bash", "-c", "python -m orchestrator.worker & uvicorn orchestrator.ingress:app --host 0.0.0.0 --port 8090 & wait -n"]
    restart: unless-stopped
    environment:
      <<: *otel-env
      TEMPORAL_TARGET: temporal:7233
      FHIR2_BASE_URL: http://openmrs:8080/openmrs/ws/fhir2/R4
      # FHIR2_BASE_URL above is plaintext http to a non-loopback host, which the write-transport
      # guard (#30) refuses by default. This demo stack talks to openmrs over the internal compose
      # bridge, so it consciously opts in: without this, the moment a real COMPLETE finding lands
      # (the #27 CAD tools) every pre-sign write raises -> bounded retries -> skip, and the draft
      # silently never appears. A real deployment sets an https FHIR2_BASE_URL instead and drops
      # this. Cleartext PHI + Basic credentials on this hop is the accepted dev-stack posture only.
      FHIR2_ALLOW_INSECURE_WRITE: "1"
      # Live fhir2 401s unauthenticated reads and the callers swallow fhir2 errors by design,
      # so missing credentials fail SILENTLY (#53). Dev-stack values = the o3 admin account.
      # Two-account split (#75/#30): FHIR2_BASIC_* is the WRITER identity (the pre-sign draft
      # here, the inbox write on communications, the sign flip on ris-sign-bridge), scoped on
      # the demo host to clinical reads plus Add/Edit Observations, the narrowest OpenMRS
      # privilege pair covering Obs-backed DiagnosticReport create/update. The fetch-only
      # agents (ehr-assistant, impression-generation, report-verification) ride FHIR2_RO_*,
      # whose default nests onto the writer creds and then admin, so a dev stack with nothing
      # set behaves exactly as before. On the host the two pairs point at radagent-svc /
      # radagent-ro, and a write under the read-only account is refused by OpenMRS naming the
      # missing privileges (live-verified 2026-08-05).
      FHIR2_BASIC_USER: ${FHIR2_BASIC_USER:-admin}
      FHIR2_BASIC_PASS: ${FHIR2_BASIC_PASS:-Admin123}
      # Pre-sign impression draft (#26) codes its DiagnosticReport with a real OpenMRS Concept
      # (fhir2 rejects a text-only code with codeRequired). Default is the LH-Radiology "AI pre-sign
      # impression draft" concept, provisioned into the o3 concept dictionary at stack startup by
      # the presign-concept-bootstrap service defined below (#55). Set FHIR2_PRESIGN_REPORT_CONCEPT
      # explicitly here so the intended UUID is visible in this file rather than only in the
      # in-code default (libs/radagent-common/radagent_common/fhir_client.py). A deployment
      # provisioning the concept at a different UUID overrides this value.
      FHIR2_PRESIGN_REPORT_CONCEPT: e3641471-3f25-57b4-ab27-a3ebc66e481e
      ORTHANC_BASE_URL: http://orthanc:8042
      # Worklist API where publish_priority_activity sends triage priority (issue #20 follow-up).
      # Best-effort: a Worklist API outage does not fail the workflow (see worklist_client.py).
      WORKLIST_API_URL: http://worklist-api:8107
      # Sign-off gate override (#57). Both must be set or the escape hatch is INERT: with no token
      # the endpoint refuses every call (503 -- it will not release a safety gate anonymously), and
      # with no URL every escalation page goes out without telling the human it wakes how to release
      # the study. A dev-stack secret; a real deployment sets its own, and SIGNOFF_OVERRIDE_URL must
      # be an address the paged human can actually reach (not the compose-internal hostname).
      SIGNOFF_OVERRIDE_TOKEN: dev-signoff-override-secret
      SIGNOFF_OVERRIDE_URL: http://localhost:8090/signoff/{workflowId}/override
      # DURABLE ingress store (#72): the report->workflow join index, poll cursor, and dead letters
      # (orchestrator/ingress_store.py) default to a path INSIDE the container. A restart during the
      # hours-long read gate would then silently lose the sign-off join -- the radiologist signs, the
      # poller matches nothing, and the study waits forever. Point it at the mounted volume below so
      # the join survives a container restart (mirrors the worklist-api SQLite store pattern).
      INGRESS_STORE_PATH: /data/ingress/ingress_state.db
    ports: ["8090:8090"]
    volumes:
      - ingress-store-data:/data/ingress
    depends_on: [temporal, openmrs, orthanc]

  worklist-triage:
    image: registry.gitlab.com/librehealth/radiology/lh-radiology-agents/worklist-triage:${APP_IMAGE_TAG:-main}
    build: { context: ., dockerfile: agents/worklist-triage/Dockerfile }
    ports: ["8101:8101"]
    environment:
      <<: *otel-env
  # ehr-assistant does live fhir2 reads (#4) — patient labs, problems, allergies, meds — so it
  # needs the same credentials as the orchestrator (#53); without them every read 401s and the
  # whole EHR context packet silently degrades to empty.
  ehr-assistant:
    image: registry.gitlab.com/librehealth/radiology/lh-radiology-agents/ehr-assistant:${APP_IMAGE_TAG:-main}
    build: { context: ., dockerfile: agents/ehr-assistant/Dockerfile }
    ports: ["8102:8102"]
    environment:
      <<: *otel-env
      FHIR2_BASIC_USER: ${FHIR2_RO_USER:-${FHIR2_BASIC_USER:-admin}}
      FHIR2_BASIC_PASS: ${FHIR2_RO_PASS:-${FHIR2_BASIC_PASS:-Admin123}}
      # Read-only fhir2 consumer: the #67 read-transport guard refuses plaintext-to-remote reads
      # without an opt-in, and this hop is plaintext http to the in-compose openmrs (same accepted
      # posture as the orchestrator's FHIR2_ALLOW_INSECURE_WRITE note; a real deployment uses an
      # https FHIR2_BASE_URL instead). READ, not WRITE: this service never writes.
      FHIR2_ALLOW_INSECURE_READ: "1"
  interpretation-assistant:
    image: registry.gitlab.com/librehealth/radiology/lh-radiology-agents/interpretation-assistant:${APP_IMAGE_TAG:-main}
    build: { context: ., dockerfile: agents/interpretation-assistant/Dockerfile }
    ports: ["8103:8103"]
    environment:
      <<: *otel-env
  # impression-generation reads report conclusions from live fhir2 (#16), so it needs the same
  # credentials as the orchestrator (#53) — without them every fetch 401s and silently degrades
  # to "no critical detection".
  impression-generation:
    image: registry.gitlab.com/librehealth/radiology/lh-radiology-agents/impression-generation:${APP_IMAGE_TAG:-main}
    build: { context: ., dockerfile: agents/impression-generation/Dockerfile }
    ports: ["8104:8104"]
    environment:
      <<: *otel-env
      FHIR2_BASIC_USER: ${FHIR2_RO_USER:-${FHIR2_BASIC_USER:-admin}}
      FHIR2_BASIC_PASS: ${FHIR2_RO_PASS:-${FHIR2_BASIC_PASS:-Admin123}}
      # Read-only fhir2 consumer: the #67 read-transport guard refuses plaintext-to-remote reads
      # without an opt-in, and this hop is plaintext http to the in-compose openmrs (same accepted
      # posture as the orchestrator's FHIR2_ALLOW_INSECURE_WRITE note; a real deployment uses an
      # https FHIR2_BASE_URL instead). READ, not WRITE: this service never writes.
      FHIR2_ALLOW_INSECURE_READ: "1"
  # report-verification reads the finalized report's conclusion from live fhir2 (#22) to parse
  # report.body (laterality, sections, BI-RADS, density) for the PI rules — same credentials as
  # impression-generation; without them every fetch 401s and the body rules silently stay inert.
  report-verification:
    image: registry.gitlab.com/librehealth/radiology/lh-radiology-agents/report-verification:${APP_IMAGE_TAG:-main}
    build: { context: ., dockerfile: agents/report-verification/Dockerfile }
    ports: ["8105:8105"]
    environment:
      <<: *otel-env
      FHIR2_BASIC_USER: ${FHIR2_RO_USER:-${FHIR2_BASIC_USER:-admin}}
      FHIR2_BASIC_PASS: ${FHIR2_RO_PASS:-${FHIR2_BASIC_PASS:-Admin123}}
      # Read-only fhir2 consumer: the #67 read-transport guard refuses plaintext-to-remote reads
      # without an opt-in, and this hop is plaintext http to the in-compose openmrs (same accepted
      # posture as the orchestrator's FHIR2_ALLOW_INSECURE_WRITE note; a real deployment uses an
      # https FHIR2_BASE_URL instead). READ, not WRITE: this service never writes.
      FHIR2_ALLOW_INSECURE_READ: "1"
  # Worklist API (issue #20): serves OHIF a sorted reading worklist by joining Orthanc completed
  # studies + orchestrator triage priority + LH-Radiology assignment (read-only). Priority arrives
  # via POST /priority from orchestrator/activities.publish_priority_activity (wiring lives in
  # Pranathi's file - separate follow-up). SQLite priority store is volume-mounted for durability
  # across restart, mirroring the ingress_store pattern in orchestrator/.
  worklist-api:
    image: registry.gitlab.com/librehealth/radiology/lh-radiology-agents/worklist-api:${APP_IMAGE_TAG:-main}
    build: { context: ., dockerfile: integrations/worklist-api/Dockerfile }
    ports: ["8107:8107"]
    environment:
      ORTHANC_BASE_URL: http://orthanc:8042
      WORKLIST_STORE_PATH: /var/lib/lhrad/worklist.sqlite
      # ack-link verify side of CRITCOM_ACK_HMAC_SECRET (fails closed when empty)
      CRITCOM_ACK_HMAC_SECRET: ${CRITCOM_ACK_HMAC_SECRET:-}
    volumes:
      - worklist-api-db:/var/lib/lhrad
    depends_on: [orthanc]
    restart: unless-stopped
  # The Communications Agent (CritCom, #52) -- the terminal COMMUNICATE stage's target. Until #69
  # this was only a note, `communications:8106` resolved to nothing, and every study parked forever
  # at COMMUNICATE retrying it (the stage's retry is deliberately unbounded); sign-off ladder pages
  # failed too. Reads clinical context from fhir2 (read-only), writes Communication/Task to the
  # comms ledger, resolves on-call from the directory the one-shot below seeds.
  communications:
    image: registry.gitlab.com/librehealth/radiology/lh-radiology-agents/communications:${APP_IMAGE_TAG:-main}
    build:
      context: .
      dockerfile: agents/communications/Dockerfile
    ports: ["8106:8106"]
    environment:
      # #28 tracing: the study-trace app services share this anchor (worklist-api, off the
      # trace path, does not), and the terminal COMMUNICATE stage must not be the one hop that
      # goes dark in a study's trace.
      <<: *otel-env
      COMMS_LEDGER_BASE_URL: http://comms-ledger:8080/fhir
      FHIR2_BASE_URL: http://openmrs:8080/openmrs/ws/fhir2/R4
      FHIR2_BASIC_USER: ${FHIR2_BASIC_USER:-admin}
      FHIR2_BASIC_PASS: ${FHIR2_BASIC_PASS:-Admin123}
      # Read-only fhir2 consumer (ServiceRequest.requester): the #67 read-transport guard refuses
      # plaintext-to-remote reads without an opt-in, and this hop is plaintext http to the
      # in-compose openmrs (see the orchestrator's FHIR2_ALLOW_INSECURE_WRITE note; a real
      # deployment uses an https FHIR2_BASE_URL). Inert until #67 merges; needed after.
      FHIR2_ALLOW_INSECURE_READ: "1"
      # Ack windows are env-overridable per deployment (a tertiary centre's Cat1 window is not a
      # rural clinic's); the showcase runs the clinical defaults (Cat1 60m / Cat2 24h / escalated
      # loops 60m), so none are overridden here.
      #
      # #79: the Observation.code concept stamped on the in-EHR critical-result notification
      # (provisioned by presign-concept-bootstrap; drift-guarded in test_presign_concept_drift).
      FHIR2_CRITICAL_NOTIFICATION_CONCEPT: ea215431-5e85-5040-adf0-1da297c154c3
      # The chart write is an operator opt-in per run, default OFF (empty). The PI write-path
      # sign-off this waited on is recorded on #79 (2026-07-21). On this in-compose plaintext
      # fhir2 the write ALSO needs FHIR2_ALLOW_INSECURE_WRITE=1 (the !57 transport guard);
      # a real deployment rides the https route (#75) and never sets the insecure flag.
      EHR_INBOX_WRITE_ENABLED: ${EHR_INBOX_WRITE_ENABLED:-}
      FHIR2_ALLOW_INSECURE_WRITE: ${FHIR2_ALLOW_INSECURE_WRITE:-}
      # #79 ack surface, producer side: no link is minted until BOTH are set (secret signs the
      # link, base URL routes it to worklist-api's /ack). Same pass-throughs as the tls overlay,
      # so a local rehearsal doesn't need a hand-edited compose.
      CRITCOM_ACK_HMAC_SECRET: ${CRITCOM_ACK_HMAC_SECRET:-}
      CRITCOM_ACK_BASE_URL: ${CRITCOM_ACK_BASE_URL:-}
      # Optional Gemini-composed notification prose (composer.py): pass-throughs only, all
      # defaulting to empty (= off) -- the flag is the only switch, and the key NEVER lives in
      # this file (operator environment only; it rides the x-goog-api-key header, no URL/log).
      COMMS_LLM_COMPOSER: ${COMMS_LLM_COMPOSER:-}
      COMMS_LLM_MODEL: ${COMMS_LLM_MODEL:-}
      COMMS_LLM_TIMEOUT_SECONDS: ${COMMS_LLM_TIMEOUT_SECONDS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      comms-ledger:
        # service_started, NOT service_healthy: the distroless HAPI image cannot host a probe
        # (see comms-ledger above), so a health gate here never opens. The agent tolerates a
        # still-booting ledger -- its client is lazy and COMMUNICATE retries unbounded.
        condition: service_started
    restart: unless-stopped

  # One-shot on-call directory seed (#69): one general-radiology Practitioner + an active
  # PractitionerRole tagged `on-call` in the LEDGER (PractitionerRole is ledger-native; fhir2
  # implements neither it nor Communication). PUT at known ids -> idempotent per `up`, same
  # contract as presign-concept-bootstrap. A single rota deliberately sidesteps the specialty-
  # routing gap (#58). Without this, an unacknowledged critical result is UNESCALATABLE: the agent
  # reports "no on-call provider is configured in the ledger" rather than paging nobody silently.
  comms-oncall-seed:
    image: python:3.11-slim@sha256:baf89808ec37adeaab83cec287adb4a2afa4a11c1d51e961c7ec737877e61af6   # pinned (#72)
    environment:
      COMMS_LEDGER_BASE_URL: http://comms-ledger:8080/fhir
    volumes:
      - ./docker/comms-ledger/seed_oncall.py:/opt/seed_oncall.py:ro
    command:
      - sh
      - -c
      - "pip install --quiet --no-cache-dir httpx==0.27.2 && python /opt/seed_oncall.py"
    depends_on:
      comms-ledger:
        # service_started, NOT service_healthy (no probe fits the distroless HAPI image -- see
        # comms-ledger above); the seed does its own readiness wait against /fhir/metadata.
        # One-shot, no restart: if it exits nonzero the on-call directory is empty (or partial,
        # if it died mid-PUT) and `up -d` will not say so -- `docker compose logs
        # comms-oncall-seed` holds the evidence. The
        # agent still tells the truth downstream (an unacknowledged critical result reports
        # escalated:false, empty directory named as the reason).
        condition: service_started
    restart: "no"

  # RIS sign -> fhir2 bridge (M4 workaround, #70): the o3 radiology module's
  # emitFhirDiagnosticReport throws ServiceNotFoundException(FhirDiagnosticReportService) on
  # every sign and swallows it, so a radiologist's Complete never reaches fhir2 or the RIS
  # poller and every read parks at AWAITING_SIGNOFF forever. This watcher mirrors COMPLETED
  # radiology_report rows into the study's seeded DiagnosticReport (authored body + status
  # final) -- identical downstream effect to the missing emit. Remove when the module fix
  # lands in the o3 sibling repo. Plaintext in-compose fhir2 hop, same posture as the ETL.
  ris-sign-bridge:
    image: registry.gitlab.com/librehealth/radiology/lh-radiology-agents/ris-sign-bridge:${APP_IMAGE_TAG:-main}
    build: { context: scripts/mimic, dockerfile: Dockerfile }
    command: python3 ris_sign_bridge.py
    environment:
      FHIR2_BASE_URL: http://openmrs:8080/openmrs/ws/fhir2/R4
      # Passthrough, not literals (#93): the #75 least-privilege fhir2 account slots in via
      # env without editing this file. Dev default stays admin.
      FHIR2_BASIC_USER: ${FHIR2_BASIC_USER:-admin}
      FHIR2_BASIC_PASS: ${FHIR2_BASIC_PASS:-Admin123}
      # Both bridges need the AI authorship concept, for opposite reasons, so it is a
      # passthrough on both and the orchestrator (line ~345) with one value behind it.
      # This one reads it to AVOID flipping the AI's pre-sign draft to final when it
      # projects a radiologist's signed report (#89). omrs_client.find_seeded_report has
      # been running on its hardcoded default since !111 for want of this line.
      FHIR2_PRESIGN_REPORT_CONCEPT: ${FHIR2_PRESIGN_REPORT_CONCEPT:-e3641471-3f25-57b4-ab27-a3ebc66e481e}
    depends_on:
      mariadb:
        condition: service_started
      openmrs:
        condition: service_started
    restart: unless-stopped

  # The pre-sign direction (#94), the mirror of ris-sign-bridge above. The o3 module's Report
  # form reads its Diagnosis field from its own radiology_report table, not from fhir2, so the
  # AI pre-sign impression (#26) lands in fhir2 as a shadow write the radiologist never sees.
  # This watcher polls fhir2 for AI-stamped preliminary DiagnosticReports and projects each
  # conclusion into a DRAFT radiology_report row, so the field is populated on first open.
  # Remove when the module reads fhir2 directly in the o3 sibling repo.
  ris-presign-bridge:
    # Same image as ris-sign-bridge: one Dockerfile and one build context serve both bridges,
    # so CI publishes one image (#97) and the command picks the direction. Naming it here keeps
    # the host's pull-based deploy (#98) able to reach this service.
    image: registry.gitlab.com/librehealth/radiology/lh-radiology-agents/ris-sign-bridge:${APP_IMAGE_TAG:-main}
    build: { context: scripts/mimic, dockerfile: Dockerfile }
    command: python3 ris_presign_bridge.py
    environment:
      FHIR2_BASE_URL: http://openmrs:8080/openmrs/ws/fhir2/R4
      # Passthrough, not literals (#93), same as the sign direction above.
      FHIR2_BASIC_USER: ${FHIR2_BASIC_USER:-admin}
      FHIR2_BASIC_PASS: ${FHIR2_BASIC_PASS:-Admin123}
      # This bridge reads the concept to MATCH the AI's draft, the opposite direction from
      # ris-sign-bridge above. Move the concept in a deployment and both follow.
      FHIR2_PRESIGN_REPORT_CONCEPT: ${FHIR2_PRESIGN_REPORT_CONCEPT:-e3641471-3f25-57b4-ab27-a3ebc66e481e}
      # Until #100 lands, OpenMRS core validates RadiologyReport.body against hibernate's
      # default 255 chars, so a longer draft would populate the Diagnosis field and then block
      # the radiologist from completing the report. The bridge clamps to fit, leaving room for
      # the wrapper TinyMCE adds on save. Raise this to match once #100 ships.
      RIS_REPORT_BODY_MAX: ${RIS_REPORT_BODY_MAX:-240}
    depends_on:
      mariadb:
        condition: service_started
      openmrs:
        condition: service_started
    restart: unless-stopped

volumes:
  mariadb-data:
  orthanc-db:
  temporal-pg-data:
  worklist-api-db:
  ingress-store-data:      # orchestrator IngressStore SQLite (#72): the sign-off join must survive a restart
  comms-ledger-data:       # comms-ledger HAPI file-based H2 (#72): the clinical-communication audit trail
