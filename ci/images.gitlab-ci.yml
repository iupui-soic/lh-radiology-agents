ohif-image:
  # The other heavy one: the Dockerfile clones and builds the OHIF monorepo. Note the base
  # checkout is the unpinned release/3.6 branch (see the MR !45 review note), so rebuilds
  # are not bit-reproducible even with unchanged inputs; publishing from CI at least makes
  # every deployed build traceable to a pipeline.
  extends: .build-image
  variables:
    IMAGE_NAME: ohif
    DOCKERFILE: integrations/ohif-extension/Dockerfile
