# Image build and publish lane (#97).
#
# Every compose service with a build: block gets an image at $CI_REGISTRY_IMAGE/<service>,
# named after the compose service. The tagging scheme:
#   - main pipelines push :main plus :$CI_COMMIT_SHORT_SHA, and run AFTER the test stages,
#     so a published image always corresponds to a green commit on main
#   - release tag pipelines (vX.Y.Z) push :$CI_COMMIT_TAG, so a demo deploy can name the
#     exact release the reviewers saw
#   - MR pipelines build WITHOUT pushing, and only the images whose inputs changed, so a
#     broken Dockerfile is caught before merge without rebuilding the world on every MR
# The o3 image is out of scope here; lh-radiology's own CI publishes it.
#
# The docker + dind pairing below mirrors lh-radiology's o3 build job, the one configuration
# proven to build and push on this group runner (docker executor, privileged, linux/amd64,
# which matches the demo host arch). Both are pinned (#72 discipline) to the digest that ran
# green in pipeline 2733426824; digest wins, the tags are labels. The two tags resolve to the
# SAME digest because the modern docker image ships the daemon and the dind entrypoint in one
# image. The service alias is explicit so the pinned name still resolves as tcp://docker.

# Publish rules shared by every image job. Anchors, not extends: each job needs its own
# rules list anyway for its per-image changes: globs, and rules: on a job replaces the
# template's wholesale.
.publish-on-main: &publish-on-main
  if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    PUBLISH_TAGS: 'main $CI_COMMIT_SHORT_SHA'

.publish-on-tag: &publish-on-tag
  if: '$CI_COMMIT_TAG'
  variables:
    PUBLISH_TAGS: '$CI_COMMIT_TAG'

.build-image:
  stage: build
  tags: [docker]
  image: docker:latest@sha256:e8faad5a8dc5279dff929afc5449f2791736912fff9f99351d742db2fad01b4c
  services:
    - name: docker:dind@sha256:e8faad5a8dc5279dff929afc5449f2791736912fff9f99351d742db2fad01b4c
      alias: docker
  variables:
    DOCKER_BUILDKIT: '1'
    BUILD_CONTEXT: '.'
    # Make the dind service plaintext on 2375 instead of TLS on 2376. The docker:dind entrypoint
    # enables TLS whenever DOCKER_TLS_CERTDIR is non-empty, and the image defaults it to /certs,
    # so without this the daemon listens only on 2376 while the client's DOCKER_HOST points at
    # 2375 and every build dies with "Cannot connect to the Docker daemon at tcp://docker:2375".
    # The 1GiB group runner already sets this in its own config, which is why the jobs pass there
    # and failed on lh-runner. Setting it on the job makes the lane work on ANY docker-tagged
    # runner rather than depending on invisible per-runner environment.
    # NOTE the GitLab services health check does not catch this: it probes 2375 AND 2376 and is
    # satisfied when either opens, so a TLS-only daemon looks healthy and fails at `docker build`.
    DOCKER_TLS_CERTDIR: ""
  # Generous ceiling for the cold first build of the heavy images (torch, OHIF monorepo).
  # Warm --cache-from runs are far shorter. The runner sets no maximum, so this stands.
  timeout: 3h
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    # Warm the layer cache from the last published main image. BuildKit tolerates an absent
    # cache source (first ever run, or an expired tag) and simply builds cold.
    - >
      docker build --pull
      --build-arg BUILDKIT_INLINE_CACHE=1
      --cache-from "$CI_REGISTRY_IMAGE/$IMAGE_NAME:main"
      -f "$DOCKERFILE" -t "$IMAGE_NAME:ci" "$BUILD_CONTEXT"
    # PUBLISH_TAGS is set by the main and tag rules and empty in MR pipelines, where the
    # loop no-ops and the job is purely a does-it-still-build check.
    - |
      if [ -z "$PUBLISH_TAGS" ]; then echo "MR pipeline: build check only, nothing pushed"; fi
      for tag in $PUBLISH_TAGS; do
        docker tag "$IMAGE_NAME:ci" "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$tag"
        docker push "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$tag"
      done

# Change globs per job list the image's actual build inputs, straight from its Dockerfile's
# COPY lines, plus this file (an edit to the lane re-proves every build, which is also what
# makes the introducing MR run all ten jobs once). The python images all copy libs/ and
# their own tree; all but worklist-api copy contracts/ too.

orchestrator-image:
  extends: .build-image
  variables:
    IMAGE_NAME: orchestrator
    DOCKERFILE: orchestrator/Dockerfile
  rules:
    - *publish-on-main
    - *publish-on-tag
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - ci/images.gitlab-ci.yml
        - orchestrator/**/*
        - libs/radagent-common/**/*
        - contracts/**/*

